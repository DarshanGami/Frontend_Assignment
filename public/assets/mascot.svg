  <ellipse cx="60" cy="75" rx="28" ry="32" stroke="#FF8DB3" stroke-width="2" fill="none"/>
  <ellipse cx="35" cy="45" rx="12" ry="16" stroke="#FF8DB3" stroke-width="1.5" fill="none"/>
  <ellipse cx="60" cy="38" rx="12" ry="16" stroke="#FF8DB3" stroke-width="1.5" fill="none"/>
